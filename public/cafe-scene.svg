<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="100%" stop-color="#e8d4a8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b7355"/>
      <stop offset="100%" stop-color="#6e5a43"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="window-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f5e6c8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background wall -->
  <rect width="800" height="600" fill="url(#wall)"/>
  <!-- Floor -->
  <rect y="420" width="800" height="180" fill="url(#floor)"/>
  <!-- Floor line -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#6e5a43" stroke-width="2"/>
  <!-- Window -->
  <rect x="50" y="60" width="250" height="300" rx="8" fill="url(#window-light)" stroke="#3d4a2d" stroke-width="3"/>
  <line x1="175" y1="60" x2="175" y2="360" stroke="#3d4a2d" stroke-width="2"/>
  <line x1="50" y1="210" x2="300" y2="210" stroke="#3d4a2d" stroke-width="2"/>
  <!-- Plant in window -->
  <rect x="140" y="280" width="70" height="60" rx="4" fill="#c67a4a"/>
  <ellipse cx="175" cy="260" rx="50" ry="40" fill="#4d5e39"/>
  <ellipse cx="155" cy="250" rx="30" ry="28" fill="#3d4a2d"/>
  <ellipse cx="195" cy="255" rx="25" ry="25" fill="#5a7042"/>
  <!-- Pendant lights -->
  <line x1="250" y1="0" x2="250" y2="100" stroke="#3d4a2d" stroke-width="1.5"/>
  <path d="M230 100 Q250 130 270 100" fill="#f5e6c8" stroke="#3d4a2d" stroke-width="1.5"/>
  <ellipse cx="250" cy="105" rx="20" ry="8" fill="#f5e6c8" stroke="#3d4a2d" stroke-width="1"/>
  <line x1="550" y1="0" x2="550" y2="80" stroke="#3d4a2d" stroke-width="1.5"/>
  <path d="M530 80 Q550 110 570 80" fill="#f5e6c8" stroke="#3d4a2d" stroke-width="1.5"/>
  <ellipse cx="550" cy="85" rx="20" ry="8" fill="#f5e6c8" stroke="#3d4a2d" stroke-width="1"/>
  <!-- Counter/bar -->
  <rect x="380" y="280" width="380" height="140" rx="6" fill="#3d4a2d"/>
  <rect x="380" y="280" width="380" height="15" rx="3" fill="#2d3820"/>
  <!-- Shelves behind counter -->
  <rect x="420" y="100" width="320" height="8" rx="2" fill="#6e5a43"/>
  <rect x="420" y="180" width="320" height="8" rx="2" fill="#6e5a43"/>
  <!-- Bottles on shelves -->
  <rect x="440" y="60" width="20" height="40" rx="4" fill="#8b7355"/>
  <rect x="480" y="50" width="18" height="50" rx="4" fill="#a08968"/>
  <rect x="520" y="55" width="22" height="45" rx="4" fill="#c67a4a"/>
  <rect x="570" y="60" width="16" height="40" rx="4" fill="#8b7355"/>
  <rect x="620" y="48" width="20" height="52" rx="4" fill="#a08968"/>
  <rect x="670" y="58" width="18" height="42" rx="4" fill="#c67a4a"/>
  <!-- Jars on lower shelf -->
  <rect x="445" y="135" width="30" height="45" rx="6" fill="#f5e6c8" stroke="#e8d4a8" stroke-width="1"/>
  <rect x="500" y="140" width="28" height="40" rx="6" fill="#f5e6c8" stroke="#e8d4a8" stroke-width="1"/>
  <rect x="555" y="132" width="32" height="48" rx="6" fill="#f5e6c8" stroke="#e8d4a8" stroke-width="1"/>
  <rect x="615" y="138" width="26" height="42" rx="6" fill="#f5e6c8" stroke="#e8d4a8" stroke-width="1"/>
  <rect x="670" y="135" width="30" height="45" rx="6" fill="#f5e6c8" stroke="#e8d4a8" stroke-width="1"/>
  <!-- Coffee machine on counter -->
  <rect x="500" y="230" width="80" height="50" rx="4" fill="#4d4d4d"/>
  <rect x="510" y="220" width="60" height="15" rx="3" fill="#333"/>
  <circle cx="540" cy="250" r="8" fill="#666" stroke="#555" stroke-width="1"/>
  <!-- Coffee cups on counter -->
  <g transform="translate(420, 255)">
    <rect x="0" y="5" width="25" height="20" rx="3" fill="#f5f5f5"/>
    <rect x="25" y="10" width="8" height="10" rx="4" fill="none" stroke="#f5f5f5" stroke-width="2"/>
    <!-- Steam -->
    <path d="M8 5 Q6 -5 10 -10 Q14 -15 12 -25" fill="none" stroke="url(#steam)" stroke-width="2">
      <animate attributeName="d" values="M8 5 Q6 -5 10 -10 Q14 -15 12 -25;M8 5 Q10 -5 8 -12 Q6 -18 10 -25;M8 5 Q6 -5 10 -10 Q14 -15 12 -25" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M16 5 Q14 -3 18 -8 Q22 -13 18 -20" fill="none" stroke="url(#steam)" stroke-width="1.5">
      <animate attributeName="d" values="M16 5 Q14 -3 18 -8 Q22 -13 18 -20;M16 5 Q18 -3 14 -10 Q12 -15 16 -20;M16 5 Q14 -3 18 -8 Q22 -13 18 -20" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Stool -->
  <rect x="400" y="435" width="50" height="8" rx="4" fill="#3d4a2d"/>
  <rect x="410" y="443" width="4" height="70" fill="#3d4a2d"/>
  <rect x="436" y="443" width="4" height="70" fill="#3d4a2d"/>
  <!-- Stool 2 -->
  <rect x="490" y="435" width="50" height="8" rx="4" fill="#3d4a2d"/>
  <rect x="500" y="443" width="4" height="70" fill="#3d4a2d"/>
  <rect x="526" y="443" width="4" height="70" fill="#3d4a2d"/>
  <!-- Menu board on wall -->
  <rect x="360" y="60" width="50" height="70" rx="3" fill="#2d3820"/>
  <line x1="368" y1="80" x2="402" y2="80" stroke="#f5e6c8" stroke-width="1" opacity="0.5"/>
  <line x1="368" y1="90" x2="398" y2="90" stroke="#f5e6c8" stroke-width="1" opacity="0.5"/>
  <line x1="368" y1="100" x2="400" y2="100" stroke="#f5e6c8" stroke-width="1" opacity="0.5"/>
  <line x1="368" y1="110" x2="395" y2="110" stroke="#f5e6c8" stroke-width="1" opacity="0.5"/>
  <!-- Warm glow overlay -->
  <rect width="800" height="600" fill="#f5e6c8" opacity="0.05"/>
</svg>